controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    # 初始几何参数，需按实车修改，并与 URDF 保持一致。
    wheel_separation: 0.125
    wheel_radius: 0.0325
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    # 无编码器：原始里程计由命令估计，IMU 在 EKF 中提供航向。
    open_loop: true
    position_feedback: true
    enable_odom_tf: false
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    pose_covariance_diagonal: [1.0, 1.0, 1000000.0, 1000000.0, 1000000.0, 1.0]
    twist_covariance_diagonal: [0.04, 0.001, 1000000.0, 1000000.0, 1000000.0, 1.0]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.20
    linear.x.min_velocity: -0.20
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.20
    angular.z.min_velocity: -1.20
